[package]
name = "renuevo-core"
description = "Núcleo de renuevo: decodificar, regenerar sin pérdida, restaurar y ampliar fotos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["heic"]
# Lectura de HEIC/HEIF mediante libheif del sistema (brew install libheif pkg-config).
heic = ["dep:libheif-rs"]

[dependencies]
image.workspace = true
libheif-rs = { workspace = true, optional = true }
fast_image_resize.workspace = true
moxcms.workspace = true
kamadak-exif.workspace = true
rayon.workspace = true
thiserror.workspace = true
blake3.workspace = true
bytemuck.workspace = true
tiff.workspace = true
png.workspace = true
zune-jpeg.workspace = true
zune-core.workspace = true
crc32fast.workspace = true
tempfile.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
