[workspace]
resolver = "3"
members = ["crates/renuevo-core", "crates/renuevo-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[workspace.dependencies]
renuevo-core = { path = "crates/renuevo-core", default-features = false }

# Imagen: solo los formatos que usamos (sin AVIF/EXR para compilar más rápido).
image = { version = "0.25.10", default-features = false, features = [
    "rayon",
    "png",
    "jpeg",
    "tiff",
    "webp",
] }
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_23"] }
fast_image_resize = { version = "6.1.0", features = ["image", "rayon"] }
moxcms = "0.9.2"
kamadak-exif = "0.6.2"
rayon = "1.12.0"
thiserror = "2.0.21"
blake3 = "1.8.7"
bytemuck = { version = "1.25.2", features = ["extern_crate_alloc"] }
# Misma versión que usa `image`; solo para leer el ICC de TIFF (ver io::decode::tiff_icc).
tiff = "0.11.3"
# Misma versión que usa `image`; solo para leer gAMA/cICP de PNG (ver io::decode::png_color).
png = "0.18.1"
# Misma versión que usa `image`; para leer los valores CMYK sin convertir (ver io::cmyk).
zune-jpeg = "0.5.15"
zune-core = "0.5.3"
# CRC de los chunks PNG que añadimos (pHYs con los DPI).
crc32fast = "1.5.5"

eframe = "0.37.0"
egui = "0.37.0"
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }
rfd = "0.18.0"

tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "thin"

# El procesamiento de imágenes es muy lento sin optimizar: optimizamos las
# dependencias y algo nuestro código también en desarrollo/tests.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
